# Run the Python test suite on every push / PR so stale or broken tests are
# caught immediately (previously there was no test gate, so several unit tests
# silently drifted out of sync with the code). Independent of the image build.
name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

# Node.js 20 is deprecated on GitHub runners — opt JS actions into Node 24
# (same as build-images.yml).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# A release pushes the commit to main AND a tag pointing at it. We test only
# on the branch push (the tag is the same SHA, already tested there),
# so the two-runs-same-SHA duplicate no longer happens and no run is left
# cancelled (a scary red ✗ on every release). The concurrency group stays as a
# backstop for any other same-SHA overlap (e.g. a branch push racing a PR sync).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Bound the job so a hung test can't sit "in progress" for hours
    # (a duplicate run stuck 47 min with no timeout is what prompted this).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        # Matches the NVENC runtime image (cpython-3.12). av / ctranslate2 /
        # faster-whisper ship manylinux wheels for 3.12, so no source builds.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: System deps
        # A few tests shell out to ffmpeg / mkvtoolnix / tesseract (subtitle
        # OCR); install the binaries so they run rather than skip/error.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra tesseract-ocr-rus fonts-dejavu-core

      - name: Versions
        # As annotations, which the API shows to anyone (the log needs an admin).
        run: echo "::notice title=Runner::$(. /etc/os-release && echo $PRETTY_NAME), $(ffmpeg -version | head -1)"

      - name: dovi_tool
        # The Dolby Vision tests (backend/dovi.py) run against it. The release
        # binary, checked against the digest GitHub publishes for it.
        run: |
          curl -fsSL -o /tmp/dovi.tar.gz https://github.com/quietvoid/dovi_tool/releases/download/2.3.4/dovi_tool-2.3.4-x86_64-unknown-linux-musl.tar.gz
          echo "1844258e13c26607b32224bf1fa82b595d3b35949f5467405fda560daad32b3f  /tmp/dovi.tar.gz" | sha256sum -c -
          mkdir -p /tmp/dovi && tar -xzf /tmp/dovi.tar.gz -C /tmp/dovi
          sudo install "$(find /tmp/dovi -name dovi_tool -type f | head -1)" /usr/local/bin/dovi_tool
          dovi_tool --version

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-timeout==2.3.1

      - name: Run pytest
        # A test that hangs fails after 5 minutes with where it hung, instead of
        # the whole job running into its limit with nothing to show.
        run: python -m pytest backend/tests -q --timeout=300
